<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Downloader</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background:#0f0f0f;
    font-family:Arial;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.box{
    width:100%;
    max-width:400px;
    text-align:center;
}

.logo{
    font-size:80px;
    color:red;
    margin-bottom:20px;
}

h1{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:18px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    background:red;
    color:white;
    font-size:20px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<div class="logo">
<i class="fab fa-youtube"></i>
</div>

<h1>
تحميل من يوتيوب
</h1>

<input
type="text"
id="videoLink"
placeholder="حط لينك الفيديو هنا"
>

<button onclick="downloadVideo()">
تحميل الفيديو
</button>

</div>

<script>

function downloadVideo(){

    let link =
    document.getElementById("videoLink").value;

    if(link == ""){
        alert("حط لينك الفيديو");
        return;
    }

    window.location.href =
    "https://en.savefrom.net/1-youtube-video-downloader-540/?url="
    + encodeURIComponent(link);

}

</script>

</body>
</html>
