<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Downloader</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:400px;
    text-align:center;
}

.logo{
    font-size:80px;
    color:red;
    margin-bottom:20px;
}

h1{
    margin-bottom:10px;
}

p{
    color:#aaa;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:18px;
    outline:none;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:red;
    color:white;
    font-size:20px;
    font-weight:bold;
}

.loading{
    margin-top:20px;
    display:none;
    color:#999;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<i class="fab fa-youtube"></i>
</div>

<h1>YouTube Downloader</h1>

<p>
تحميل الفيديوهات بسهولة
</p>

<input
type="text"
id="videoLink"
placeholder="حط لينك الفيديو هنا"
>

<button onclick="downloadVideo()">
تحميل الفيديو
</button>

<div class="loading" id="loading">
جاري تجهيز الفيديو...
</div>

</div>

<script>

function downloadVideo(){

    let link =
    document.getElementById("videoLink").value;

    if(link == ""){
        alert("حط لينك الفيديو");
        return;
    }

    document.getElementById("loading").style.display = "block";

    window.location.href =
    "https://social-downloader-production-6d44.up.railway.app/download?url="
    + encodeURIComponent(link);

}

</script>

</body>
</html>
